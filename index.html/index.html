<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guarapuava – Paraná</title>
<style>
  :root{--bg:#f6f4ee;--card:#fff;--text:#25302a;--muted:#5d6b62;--accent:#2e6b4a;--soft:#e3efe8;--line:#dcd8cc}
  @media (prefers-color-scheme:dark){:root{--bg:#151b17;--card:#1e2621;--text:#e8ece9;--muted:#a2b0a7;--accent:#6fc196;--soft:#24352b;--line:#33403a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;line-height:1.7}
  header{background:var(--accent);color:#fff;text-align:center;padding:44px 20px 36px}
  header h1{margin:0 0 6px;font-size:clamp(2rem,6vw,3.2rem)}
  header p{margin:0;font-style:italic;opacity:.92}
  .hero{max-width:900px;margin:-1px auto 0;padding:0 20px}
  .hero img{width:100%;height:auto;display:block;border-radius:0 0 14px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  .hero figcaption{font:.85rem system-ui,sans-serif;color:var(--muted);text-align:center;margin-top:8px}
  main{max-width:820px;margin:0 auto;padding:32px 20px 48px}
  h2{color:var(--accent);border-bottom:2px solid var(--soft);padding-bottom:6px;margin:34px 0 12px}
  p{margin:0 0 14px;text-align:justify}
  .dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;font-family:system-ui,sans-serif;margin-top:18px}
  .dado{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .dado strong{display:block;font-size:1.25rem;color:var(--accent)}
  .dado span{font-size:.82rem;color:var(--muted)}
  a{color:var(--accent);font-weight:600}
  footer{text-align:center;padding:24px 20px;color:var(--muted);font:.95rem system-ui,sans-serif;border-top:1px solid var(--line)}
  footer p{margin:0 0 6px;text-align:center}
</style>
</head>
<body>
<header>
